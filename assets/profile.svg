<svg width="500" height="500" viewBox="0 0 500 500"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .photo {
      opacity: 0;
      transform-origin: center;
      animation: appear 2.5s ease-in-out forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  <image
    class="photo"
    href="../PHOTO.png"
    x="0"
    y="0"
    width="500"
    height="500"
    preserveAspectRatio="xMidYMid slice"
  />

</svg>
